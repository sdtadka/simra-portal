<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin · Community Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1e6bff;--green:#12a150;--orange:#ff8a00;--purple:#7c3aed;--red:#e5484d;--gold:#c99a2e;--teal:#0d9488;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--bg:#f5f7fb;--blue-t:#eaf1ff;--green-t:#e8f8ef;--orange-t:#fff3e2;--purple-t:#f1eaff;--red-t:#fdecec;--gold-t:#fbf4df}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#topbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:300;overflow:hidden;background:transparent;display:none}
#topbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--blue),var(--green),var(--gold));animation:slide 1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#boot{position:fixed;inset:0;background:#fff;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#boot .bt{font-size:17px;font-weight:600;color:var(--ink)}
#boot .bs{font-size:13px;color:var(--muted)}
#boot .bar{width:min(340px,80vw);height:10px;border-radius:99px;background:#eef1f6;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s ease}
#boot.gone{display:none}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(15,23,42,.05)}
.badge{display:flex;align-items:center;gap:10px;min-width:210px}
.shield{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#4f8dff);display:grid;place-items:center;color:#fff}
.badge b{display:block;font-size:15px}
.badge small{color:var(--muted);font-size:11.5px}
.center{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.seal{width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--green);flex:0 0 54px;display:grid;place-items:center;overflow:hidden;color:var(--green)}
.seal img{width:100%;height:100%;object-fit:cover}
.orgname{font-family:Amiri,serif;font-size:22px;color:#0b3a7a;line-height:1.1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgtag{font-size:12px;color:var(--green);text-align:center}
.right{display:flex;align-items:center;gap:10px;min-width:120px;justify-content:flex-end}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;cursor:pointer;overflow:hidden;border:2px solid #fff;box-shadow:0 4px 14px -6px var(--blue)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar:hover{outline:2px solid var(--blue)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 150px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;font-size:13.5px}
.nv:hover{background:#f2f5fb}
.nv.on{background:linear-gradient(90deg,var(--blue-t),#fff);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 var(--blue)}
.nv svg.i{color:var(--c,#64748b)}
.side .lang{margin-top:auto;padding-top:14px}
.side select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}
.logout{margin-top:10px;border:0;border-radius:12px;padding:10px 12px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
.main{padding:22px 24px 40px;min-width:0}
h2.pt{font-size:22px;font-weight:600;margin-bottom:4px}
.psub{color:var(--muted);font-size:13px;margin-bottom:16px}
h3.sec{font-size:15px;font-weight:600;margin:22px 0 10px}
.muted{color:var(--muted)}
.loading,.empty{padding:30px;text-align:center;color:var(--muted)}
.errbox{padding:18px;border-radius:14px;background:var(--red-t);color:#8a1c20;border:1px solid #f6c6c8;line-height:1.6}
.big4{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.big{border:0;border-radius:18px;padding:18px 20px;color:#fff;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:96px;transition:transform .15s;box-shadow:0 14px 26px -16px rgba(15,23,42,.45)}
.big:hover{transform:translateY(-3px)}
.big .ic{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 50px}
.big .ic svg.i{width:26px;height:26px}
.big .lb{font-size:13px;opacity:.95;display:block}
.big b{display:block;font-size:28px;font-weight:700;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border-radius:16px;padding:14px;border:1px solid transparent;text-align:left;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tile .ti svg.i{width:20px;height:20px}
.tile .lb{font-size:12.5px;color:var(--ink)}
.tile b{font-size:22px;font-weight:700}
.bl{background:var(--blue)}.gr{background:var(--green)}.or{background:var(--orange)}.pu{background:var(--purple)}.re{background:var(--red)}.go{background:var(--gold)}
.t-blue{background:var(--blue-t);border-color:#cfe0ff}.t-blue b{color:var(--blue)}
.t-green{background:var(--green-t);border-color:#c4ebd4}.t-green b{color:var(--green)}
.t-orange{background:var(--orange-t);border-color:#ffdcae}.t-orange b{color:var(--orange)}
.t-purple{background:var(--purple-t);border-color:#dccffd}.t-purple b{color:var(--purple)}
.t-red{background:var(--red-t);border-color:#f6c6c8}.t-red b{color:var(--red)}
.t-gold{background:var(--gold-t);border-color:#f0dfb0}.t-gold b{color:var(--gold)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.inp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
.inp:focus{outline:2px solid #bcd3ff;border-color:var(--blue)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--blue);color:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.green{background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.purple{background:var(--purple)}
.btn.red{background:var(--red)}
.btn.gold{background:var(--gold)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12.5px}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.c-paid{background:#d9f5e4;color:#127a45}
.c-due{background:#fde0e1;color:#b42328}
.c-imam{background:var(--orange-t);color:#b35f00}
.c-blk{background:#e5e7eb;color:#374151}
.c-role{background:var(--blue-t);color:var(--blue)}
.wrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
table.t th{text-align:left;padding:10px 9px;background:#f7f9fd;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 9px;border-bottom:1px solid #eef1f6;vertical-align:middle;white-space:nowrap}
table.t tr:hover td{background:#fbfcff}
tr.row-paid td{background:#f3fbf6}
tr.row-due td{background:#fff5f5}
.nm{color:var(--blue);font-weight:600;cursor:pointer;background:none;border:0;text-align:left}
.nm:hover{text-decoration:underline}
.mono{font-family:"Courier New",monospace;font-size:12.5px}
.acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cl{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12.5px;padding:6px 10px;border-radius:9px;color:#fff}
.cl.call{background:var(--blue)}
.cl.wa{background:#25a244}
.cl svg.i{width:15px;height:15px}
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dpbox{text-align:center;min-width:150px}
.pic{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,var(--blue-t),#dfe9ff);display:grid;place-items:center;font-size:44px;font-weight:700;color:var(--blue);overflow:hidden;margin:0 auto;border:4px solid #fff;box-shadow:0 10px 24px -10px var(--blue);cursor:pointer;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.pic:hover::after{content:'Change photo';position:absolute;inset:auto 0 0 0;background:rgba(15,23,42,.65);color:#fff;font-size:12px;padding:6px;text-align:center}
.appid{margin-top:10px;font-size:20px;font-weight:700;letter-spacing:1px;color:var(--ink);font-family:Arial,sans-serif}
.appid small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.pname{font-size:22px;font-weight:600}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px;margin-top:14px}
.info div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.info div b{font-weight:500}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.sumc{border-radius:16px;padding:16px;color:#fff}
.sumc span{font-size:12.5px;opacity:.95}
.sumc b{display:block;font-size:22px;margin-top:4px}
.creds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cred{border:1px dashed #cbd5e1;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cred span{font-size:11.5px;color:var(--muted)}
.cred b{display:block;font-family:"Courier New",monospace;font-size:16px;letter-spacing:.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fgrid .full{grid-column:1/-1}
.fl{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.fl input,.fl select,.fl textarea{width:100%}
.fl textarea{min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;width:100%}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.prev{width:70px;height:70px;border-radius:12px;object-fit:cover;margin-top:6px;border:1px solid var(--line)}
.pbar{height:14px;border-radius:99px;background:#eef1f6;overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .35s ease}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
#ov.open{display:flex}
#ov .box{background:#fff;border-radius:18px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:22px;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
#ov .box.wide{width:min(900px,100%)}
#ov .ttl{font-size:17px;font-weight:600;margin-bottom:14px;padding-right:34px}
#ov .x{position:absolute;right:12px;top:10px;border:0;background:#f1f5f9;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
#ov .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;display:none;z-index:200;max-width:92vw;text-align:center}
/* ---------- Receipt: ek hi A4 page, bold sans-serif ---------- */
.rc{background:#fff;border:2px solid #1b4332;border-radius:8px;padding:12px 14px;position:relative;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:11px;color:#000}
.rc-head{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;border-bottom:2px solid #1b4332;padding-bottom:6px;margin-bottom:6px}
.rc-head .lg{width:52px;height:52px;border-radius:50%;border:2px solid #1b4332;display:grid;place-items:center;overflow:hidden}
.rc-head .lg img{width:100%;height:100%;object-fit:cover}
.rc-head .ttl{text-align:center}
.rc-head .ttl h2{font-size:17px;font-weight:900;text-transform:uppercase}
.rc-head .ttl p{font-size:10px;font-weight:700;margin-top:2px}
.rc-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;border:1px solid #000;padding:4px 8px;margin-bottom:6px;font-size:11px}
.rc-mid{display:grid;grid-template-columns:1.3fr 1fr;gap:6px;margin-bottom:6px}
.rc-box{border:1px solid #000;padding:5px 7px}
.rc-box div{display:flex;justify-content:space-between;gap:6px;padding:2px 0;border-bottom:1px dotted #777;font-size:10.5px}
.rc-box div:last-child{border:0}
.rc-box span{font-weight:700;text-transform:uppercase}
.rc-box b{text-align:right;font-weight:900}
.rc-box .rcid{font-size:13px;font-weight:900}
.rc-sum{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rc-sum div{border:1px solid #000;padding:4px;text-align:center;font-size:9.5px}
.rc-sum b{display:block;font-size:12.5px;font-weight:900;margin-top:2px}
table.rt{width:100%;border-collapse:collapse;font-size:10px;border:1px solid #000}
table.rt th{background:#1b4332;color:#fff;padding:3px 4px;text-align:left;font-size:9.5px;font-weight:900}
table.rt td{padding:2px 4px;border-bottom:1px solid #999;font-weight:700;white-space:nowrap}
table.rt tr.mon td{background:#e9f3ec;font-weight:900}
.rc-sig{display:flex;justify-content:space-between;margin-top:10px;gap:14px}
.rc-sig div{width:170px;text-align:center;font-size:10px}
.rc-sig .si{height:34px;display:flex;align-items:flex-end;justify-content:center}
.rc-sig .si img{max-height:34px;max-width:130px;object-fit:contain}
.rc-sig .ln{border-bottom:1px solid #000;margin:2px 0 3px}
.rc-sig b{display:block;font-size:10px;font-weight:900}
.cred-box{background:#0f172a;color:#fff;border-radius:14px;padding:14px;display:grid;gap:10px}
.cred-box div{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cred-box b{font-family:"Courier New",monospace;font-size:18px;letter-spacing:1px}
.cred-box small{color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.6px;display:block}
.sec-card{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.sec-card .thumb{width:120px;height:90px;border-radius:12px;background:#eef3ff;display:grid;place-items:center;color:var(--blue)}
.sec-card img{width:120px;height:90px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.sec-card p{color:var(--muted);margin-top:6px;line-height:1.6;white-space:pre-wrap}
@media (max-width:980px){.big4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .top{flex-wrap:wrap;padding:10px 12px;gap:8px}
  .badge{min-width:0}
  .badge small{display:none}
  .center{order:3;width:100%;flex-direction:column;gap:2px}
  .seal{width:44px;height:44px;flex-basis:44px}
  .orgname{font-size:18px}
  .right{min-width:0}
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:0;z-index:30;background:#fff}
  .nv{white-space:nowrap;padding:8px 11px;font-size:12.5px}
  .logout{margin:0;white-space:nowrap}
  .side .lang{margin:0 0 0 auto;padding:0;min-width:110px}
  .main{padding:14px}
  .fgrid,.creds,.rc-mid{grid-template-columns:1fr}
  .big{min-height:84px}
  .big b{font-size:22px}
  .sec-card{grid-template-columns:1fr}
  .sec-card img,.sec-card .thumb{width:100%;height:160px}
  .pacts{margin-left:0;width:100%}
}
@media print{
  @page{size:A4 portrait;margin:8mm}
  body *{visibility:hidden}
  #rc,#rc *{visibility:visible}
  #rc{position:absolute;left:0;top:0;width:194mm;padding:6mm;box-shadow:none;border:2px solid #1b4332;border-radius:0;font-size:9.5px}
  #rc .rc-head .ttl h2{font-size:14px}
  #rc table.rt td,#rc table.rt th{padding:1px 3px;font-size:8.5px}
  #rc .rc-box div{font-size:9px}
  #rc .rc-sum b{font-size:11px}
  #rc .rc-sig{margin-top:6px}
  #rc .rc-sig .si{height:26px}
  .noprint{display:none!important}
  #ov{position:static!important;background:none!important;display:block!important;padding:0!important}
  #ov .box{box-shadow:none;max-height:none;overflow:visible;padding:0;width:100%;max-width:100%}
  .top,.side,#topbar,#boot{display:none!important}
}
</style>
</head>
<body>

<div id="topbar"><i></i></div>
<div id="boot">
  <div class="bt" id="bootT">Connecting…</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div class="bs" id="bootS">Please wait</div>
</div>

<header class="top">
  <div class="badge">
    <div class="shield"><svg class="i" viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l7 3v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/></svg></div>
    <div><b>Super Admin</b><small id="roleLine">Full control</small></div>
  </div>
  <div class="center">
    <div class="seal" id="seal"></div>
    <div>
      <div class="orgname" id="orgName">Community</div>
      <div class="orgtag">Ilm • Iman • Seva</div>
    </div>
  </div>
  <div class="right">
    <div class="avatar" id="av" data-act="profile" title="My profile">S</div>
  </div>
</header>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="loading">Loading…</div></main>
</div>

<div id="ov"><div class="box" id="ovBox">
  <button class="x noprint" data-act="close" aria-label="Close">×</button>
  <div class="ttl" id="ovT"></div>
  <div id="ovB"></div>
  <div class="foot" id="ovF"></div>
</div></div>
<input type="file" id="dpFile" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
/* ============ ICONS ============ */
const P = {
  shield: 'M12 3l7 3v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z',
  users: 'M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM3 21a7 7 0 0 1 14 0M17 14a4 4 0 0 1 4 4v3',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
  mosque: 'M4 21V11a8 8 0 0 1 16 0v10M2 21h20M12 3v2M9 21v-4a3 3 0 0 1 6 0v4',
  book: 'M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0 0 4h14',
  dome: 'M3 21h18M5 21v-6a7 7 0 0 1 14 0v6M12 4v2',
  grave: 'M7 21V10a5 5 0 0 1 10 0v11M4 21h16M12 8v4M10 10h4',
  family: 'M12 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM7 21v-6l-2-2 2-4h6l2 4-2 2v6M9 9l-2 5',
  money: 'M3 7h18v10H3zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
  hourglass: 'M6 2h12M6 22h12M7 2c0 5 5 6 5 10s-5 5-5 10M17 2c0 5-5 6-5 10s5 5 5 10',
  alert: 'M12 3l10 18H2zM12 10v5M12 18v.5',

let BUSY = 0;
function busyStart() { BUSY++; $('#topbar').style.display = 'block'; }
function busyEnd() { BUSY = Math.max(0, BUSY - 1); if (!BUSY) $('#topbar').style.display = 'none'; }
function bootProgress(pct, title, sub) {
  $('#bootBar').style.width = pct + '%';

}
function bootDone() { $('#boot').classList.add('gone'); }

/* Server call: TOKEN apne aap pehle argument ke roop mein */
async function api(fn, ...a) {
  busyStart();
  try {
    const r = await apiCall(fn, [TOKEN, ...a]);
    if (r && r.expired) { await leave(true); throw new Error('expired'); }
    if (r && r.ok === false) throw new Error(r.msg || 'Something went wrong.');
    return r;
  } finally { busyEnd(); }
}
function toast(m) {
  const el = $('#toast'); el.textContent = m; el.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 2600);
}
function digits(m) { const x = String(m || '').replace(/\D/g, ''); return x.length === 10 ? '91' + x : x; }
function callLink(m) { const d = digits(m); return d ? `<a class="cl call" href="tel:+${d}">${ic('phone')}Call</a>` : ''; }
function waLink(m, label) {
  const d = digits(m); if (!d) return '';
  return `<a class="cl wa" href="https://wa.me/${d}?text=${encodeURIComponent('Hello')}" target="_blank" rel="noopener">${ic('chat')}${label || 'WhatsApp'}</a>`;
}
function modal(title, body, foot, wide) {
  $('#ovT').textContent = title; $('#ovB').innerHTML = body; $('#ovF').innerHTML = foot || '';
  $('#ovBox').classList.toggle('wide', !!wide); $('#ov').classList.add('open');
}
function closeM() { $('#ov').classList.remove('open'); }
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
function copyText(s) { try { navigator.clipboard.writeText(s); toast('Copied'); } catch (e) { toast('Copy manually.'); } }
function fileToB64(f) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(f); }); }
function downloadCsv(name, text) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function avatarHtml(name, url) {
  return url ? `<img src="${esc(url)}" alt="">` : esc((name || 'S').charAt(0).toUpperCase());
}

async function openPersonForm(role, appNo) {
  let p = null;
  if (appNo) {
    const d = await api('apiSuperGetPerson', appNo);
    p = d.person; p.opening = d.summary.opening; role = p.role;
  }
  const isSuper = ME.role === 'super_admin';
  let admins = null;
  if (isSuper) {
    const o = await api('apiSuperOverview');
    admins = (o.admins || []).filter(a => a.status === 'ACTIVE');
    if (!admins.length) return toast('Create an Admin first (Admins page).');
  }
  modal(p ? `${t('edit')} · ${p.name}` : `${t('add')} · ${LBL[role] || role}`, personForm(role, p, admins),
    `<button class="btn light" data-act="close">${t('cancel')}</button><button class="btn green" id="btnSave">${t('save')}</button>`);
  $('#btnSave').addEventListener('click', async () => {
    const btn = $('#btnSave'); if (btn.disabled) return; btn.disabled = true;
    try {
      const body = {
        appNo: p ? p.appNo : '', role: role, name: val('fName'), father: val('fFather'), mobile: val('fMobile'),
        address: val('fAddr'), joinDate: val('fJoin'), adminId: isSuper ? val('fAdmin') : '', photoUrl: val('fPhotoUrl'),
        password: val('fPass'), token: p ? '' : val('fTok'),
        qualification: val('fQual'), whatsapp: val('fWa'), salary: val('fSal'), opening: val('fOpen') || 0
      };
      const r = await api('apiSuperSavePerson', body);
      if (!p) return showCreds('New person added', r.appNo, r.password, r.token);
      if (r.password || r.token) return showCreds('Login details updated', r.appNo, r.password, r.token);
      closeM(); toast('Saved'); openPersonPage($('#main'), p.appNo);
    } catch (e) { if (e.message !== 'expired') toast(e.message); }
    finally { btn.disabled = false; }
  });
}

async function openReceipt(id) {
  const r = await api('apiSuperReceipt', id);
  const o = r.org, p = r.person;
  const logo = o.logo ? `<img src="${esc(o.logo)}" alt="">` : ic('mosque', 26);
  const sigC = r.sigCollector ? `<img src="${esc(r.sigCollector)}" alt="">` : '';
  const sigA = r.sigAuth ? `<img src="${esc(r.sigAuth)}" alt="">` : '';
  let rowsHtml = '', prevMonth = '';
  r.rows.forEach(x => {
    const newMonth = x.month !== prevMonth;
    prevMonth = x.month;
    rowsHtml += `<tr class="${newMonth ? 'mon' : ''}">
      <td>${x.no}</td><td>${esc(x.month)}</td><td>${esc(x.date)}</td><td>${esc(x.mode)}</td>

  modal(t('print'), `<div class="rc" id="rc">
    <div class="rc-head">
      <div class="lg">${logo}</div>
      <div class="ttl"><h1>Receipt</h1><h2>${esc(o.name)}</h2><p>${esc(o.address)}${o.reg ? ' · ' + esc(o.reg) : ''}</p></div>

      <span>Receipt: <b>${esc(r.receiptId)}</b></span>
      <span>Date: <b>${esc(r.issued)}</b></span>
      <span>Year: <b>${r.year}</b></span>
    </div>
    <div class="rc-mid">
      <div class="rc-box">
        <div><span>Application ID</span><b class="rcid">${esc(p.appNo)}</b></div>
        <div><span>Name</span><b>${esc(p.name)}</b></div>
        <div><span>Father's name</span><b>${esc(p.father || '—')}</b></div>
        <div><span>Mobile</span><b>${esc(p.mobile || '—')}</b></div>
        <div><span>Address</span><b>${esc(p.address || '—')}</b></div>
        <div><span>Admin</span><b>${esc(p.adminName || '—')}</b></div>
      </div>
      <div class="rc-sum">
        <div><span>Total due</span><b>${inr(r.due)}</b></div>
        <div><span>Total paid</span><b>${inr(r.paid)}</b></div>
        <div><span>Balance</span><b>${inr(r.balance)}</b></div>
        <div><span>Transactions</span><b>${r.rows.length}</b></div>
      </div>
    </div>
    <table class="rt">
      <thead><tr><th>#</th><th>Month</th><th>Date</th><th>Mode</th><th>Txn no.</th><th>Collector</th><th style="text-align:right">Amount</th><th style="text-align:right">Balance</th></tr></thead>
      <tbody>${rowsHtml || '<tr><td colspan="8">No transactions.</td></tr>'}</tbody>
    </table>
    <div class="rc-sig">
      <div><div class="si">${sigC}</div><div class="ln"></div><b>${esc(r.issuedBy || '—')}</b><small>(Collector)</small></div>
      <div><div class="si">${sigA}</div><div class="ln"></div><b>${esc(o.name)}</b><small>Authorised signatory</small></div>
    </div>
  </div>`,
  `<button class="btn light noprint" data-act="close">${t('close')}</button><button class="btn noprint" data-act="printNow">${ic('print')}${t('print')}</button>`, true);

const IMPORT_BATCH = 40;
VIEWS.import = async (c) => {
  c.innerHTML = `
    <h2 class="pt">${t('import')}</h2>
    <p class="psub">Only Name is required. Father's name, address, mobile, back-year due and paid amount can be empty and edited later.</p>

        <button class="btn light" data-act="dataCsv">${ic('download')}Export current data</button></div>
    </div>
    <div class="card">
      <h3 class="sec" style="margin-top:0">2. Upload CSV (ek file, ek baar import)</h3>
      <p class="hint">Columns: User ID, Password, Token ID, Name, Father's Name, Mobile, Address, Back year due, Current year subscription, Paid amount, Photo URL, Role (member or user).</p>
      <div class="acts">
        <input type="file" id="csvFile" accept=".csv,text/csv" class="inp">
        <button class="btn green" id="btnImport" data-act="runImport" disabled>Import</button>
      </div>
      <p class="hint" id="csvInfo" style="margin-top:10px">No file selected.</p>
      <div class="pbar"><i id="impBar"></i></div>
      <div id="impText" class="muted" style="font-size:13px"></div>
      <div id="impRes" style="margin-top:14px"></div>
    </div>`;
  if (CSV_TEXT) { $('#csvInfo').textContent = CSV_NAME + ' · ' + CSV_ROWS + ' rows ready'; $('#btnImport').disabled = false; }
};

async function runImport() {
  if (IMPORTING) return;
  if (!CSV_TEXT) return toast('Select a CSV file first.');
  IMPORTING = true;
  const btn = $('#btnImport'); btn.disabled = true; $('#csvFile').disabled = true;
  const lines = CSV_TEXT.split(/\r?\n/).filter(l => l.trim() !== '');
  const header = lines[0], rows = lines.slice(1);
  const total = rows.length;
  let added = 0, done = 0; const errors = [];
  try {
    for (let i = 0; i < rows.length; i += IMPORT_BATCH) {
      const chunk = rows.slice(i, i + IMPORT_BATCH);
      $('#impText').textContent = 'Importing rows ' + (done + 1) + ' to ' + (done + chunk.length) + ' of ' + total + '…';
      const r = await api('apiSuperImport', header + '\n' + chunk.join('\n'));
      added += r.added;
      r.errors.forEach(e => errors.push(e.replace(/Row (\d+):/, (m, n) => 'Row ' + (Number(n) + i + 1) + ':')));
      done += chunk.length;
      $('#impBar').style.width = Math.round(done / total * 100) + '%';
      $('#impText').textContent = 'Imported ' + done + ' of ' + total + ' rows · added ' + added;
    }
    $('#impText').textContent = 'Done. Added ' + added + ' of ' + total + ' rows.';
    $('#impRes').innerHTML = `<div class="cred-box"><div><div><small>Added</small><b>${added}</b></div></div>
      <div><div><small>Errors</small><b>${errors.length}</b></div></div></div>
      ${errors.length ? `<div class="card" style="margin-top:10px">${errors.map(e => `<div>${esc(e)}</div>`).join('')}</div>` : ''}`;
    toast('Import complete');
  } catch (e) {
    if (e.message !== 'expired') toast(e.message);
  } finally {
    IMPORTING = false;
    CSV_TEXT = null; CSV_NAME = ''; CSV_ROWS = 0;
    $('#csvFile').value = ''; $('#csvFile').disabled = false;
    $('#csvInfo').textContent = 'Import finished. Select a NEW file to import again.';
    btn.disabled = true;
  }
}

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) {
    closeM();
    try { return go(g.dataset.go, JSON.parse(g.dataset.arg || '{}')); }
    catch (err) { return toast(err.message); }
  }
  const avatar = e.target.closest('#av');
  if (avatar) return go('profile', {});
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACTS[b.dataset.act];
  if (!fn) return;
  try { await fn(b.dataset.id || '', b); }
  catch (err) { if (err.message !== 'expired') toast(err.message); }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'langSel') {
    LANG = e.target.value; localStorage.setItem(LS_L, LANG);
    document.documentElement.dir = LANG === 'ur' ? 'rtl' : 'ltr';
    drawNav(); go(D.view, D.arg); return;
  }
  if (e.target.id === 'csvFile') {
    const f = e.target.files[0];
    if (!f) { CSV_TEXT = null; $('#btnImport').disabled = true; return; }
    CSV_TEXT = await f.text();
    CSV_NAME = f.name;
    const n = CSV_TEXT.split(/\r?\n/).filter(l => l.trim() !== '').length - 1;
    CSV_ROWS = Math.max(0, n);
    $('#csvInfo').textContent = f.name + ' · ' + CSV_ROWS + ' rows ready. Press Import once.';
    $('#impBar').style.width = '0%'; $('#impText').textContent = '';
    $('#btnImport').disabled = CSV_ROWS === 0;
    return;
  }
  if (e.target.id === 'dpFile') {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (f.size > 1.4 * 1024 * 1024) return toast('Photo must be under 1.4 MB.');
    try {
      toast('Uploading photo…');
      const b64 = await fileToB64(f);
      const r = await api('apiUploadPhoto', b64, f.type, f.name);
      if (DP_MODE === 'me') {
        await api('apiAdminSetPhoto', r.url);
        MY_PHOTO = r.url;
        $('#av').innerHTML = avatarHtml(ME.name, MY_PHOTO);
        toast('Photo saved');
        if (D.view === 'profile') go('profile', {});
      } else {
        await savePersonPhoto(r.url);
      }
    } catch (err) { if (err.message !== 'expired') toast(err.message); }
    return;
  }
  if (e.target.id === 'fPhoto' || e.target.id === 'sPhoto') {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 1.4 * 1024 * 1024) return toast('Photo must be under 1.4 MB.');
    const b64 = await fileToB64(f);
    try {
      toast('Uploading photo…');
      const r = await api('apiUploadPhoto', b64, f.type, f.name);
      const person = e.target.id === 'fPhoto';
      $(person ? '#fPhotoUrl' : '#sPhotoUrl').value = r.url;
      const img = $(person ? '#fPrev' : '#sPrev'); img.src = r.url; img.style.display = 'block';
      toast('Photo uploaded');
    } catch (err) { if (err.message !== 'expired') toast(err.message); }
  }
});

/* ============ HEADER ============ */
function applyOrg(o) {
  if (o.name !== undefined) $('#orgName').textContent = o.name || 'Community';
  $('#seal').innerHTML = o.logo ? `<img src="${esc(o.logo)}" alt="" onerror="this.remove()">${ic('mosque', 28)}` : ic('mosque', 28);
}

/* ============ BOOT (progress ke saath) ============ */
async function boot() {
  document.documentElement.dir = LANG === 'ur' ? 'rtl' : 'ltr';
  TOKEN = localStorage.getItem(LS_S);
  if (!TOKEN) return goPage('index.html');
  try {
    bootProgress(15, 'Checking your login…', 'Verifying session');
    const r = await apiCall('apiSession', [TOKEN]);
    if (!r || !r.ok) return leave(true);
    if (r.user.role !== 'super_admin') return goPage(ROLE_PAGE[r.user.role] || 'index.html');
    if (r.mustChange) return goPage('index.html');
    ME = r.user;
    applyOrg({ name: (r.org && r.org.name) || 'Community', logo: (r.org && r.org.logo) || '' });
    bootProgress(35, 'Loading your profile…', 'Photo and details');
    const ph = await apiCall('apiAdminGetPhoto', [TOKEN]).catch(() => null);
    MY_PHOTO = (ph && ph.url) || '';
    $('#av').innerHTML = avatarHtml(ME.name, MY_PHOTO);
    $('#roleLine').textContent = ME.name + ' · Full control';
    bootProgress(60, 'Loading dashboard…', 'Counts and payments');
    startIdle();
    await go('dash', {});
    bootProgress(100, 'Ready', 'Welcome');
    setTimeout(bootDone, 250);
  } catch (e) {
    bootDone();
    showError(e.message);
  }
}

let LAST = Date.now();
function startIdle() {
  ['mousemove', 'keydown', 'click', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { LAST = Date.now(); }, { passive: true }));
  setInterval(async () => {
    if (!TOKEN) return;
    if (Date.now() - LAST > 15 * 60 * 1000) { toast('Logged out after 15 minutes of inactivity.'); return leave(false); }
    const r = await apiCall('apiSession', [TOKEN]).catch(() => null);
    if (!r || !r.ok) leave(true);
  }, 60000);
}

boot();
</script>
