<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin · Community Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1e6bff;--green:#12a150;--orange:#ff8a00;--purple:#7c3aed;--red:#e5484d;--gold:#c99a2e;--ink:#0f172a;--muted:#64748b;--line:#e6eaf2;--bg:#f4f7fc;--navy:#0b2a5b;--blue-t:#eaf1ff;--green-t:#e8f8ef;--orange-t:#fff3e2;--purple-t:#f1eaff;--red-t:#fdecec;--gold-t:#fbf4df}
html,body{overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
img.ic{width:100%;height:100%;object-fit:cover;display:block}
#topbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:300;overflow:hidden;display:none}
#topbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--blue),var(--green),var(--gold));animation:slide 1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#boot{position:fixed;inset:0;background:#fff;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#boot.gone{display:none}
#boot .bt{font-size:17px;font-weight:600}
#boot .bs{font-size:13px;color:var(--muted)}
#boot .bar{width:min(340px,80vw);height:10px;border-radius:99px;background:#eef1f6;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s ease}

/* ---------- HEADER (image jaisa) ---------- */
.hd{position:relative;background:linear-gradient(180deg,#dbeafe 0%,#eef6ff 60%,#f4f7fc 100%);padding:12px 14px 10px;text-align:center;overflow:hidden}
.hd .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.menubtn,.avatar{width:46px;height:46px;border-radius:50%;flex:0 0 46px;display:grid;place-items:center;cursor:pointer;border:2px solid #fff;box-shadow:0 6px 16px -8px var(--blue)}
.menubtn{background:linear-gradient(135deg,#1e6bff,#4f8dff);color:#fff;border:0}
.avatar{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff;overflow:hidden;font-weight:700;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover}
.seal{width:96px;height:96px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--green);display:grid;place-items:center;overflow:hidden;color:var(--green);box-shadow:0 8px 20px -10px var(--green)}
.seal img{width:100%;height:100%;object-fit:cover}
.orgname{margin-top:6px;font-size:21px;font-weight:800;color:var(--navy);line-height:1.15;word-break:break-word}
.role{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 12px;border-radius:99px;background:#fff;color:var(--blue);font-weight:700;font-size:13px;border:1px solid #cfe0ff}
.role svg.i{width:16px;height:16px}
.tag{margin-top:6px;color:var(--green);font-weight:600;font-size:13px}

/* ---------- TABS (fixed size, active par bada nahin hota) ---------- */
.tabs{display:flex;background:#fff;margin:10px 12px 0;border-radius:16px;box-shadow:0 8px 20px -14px rgba(15,23,42,.35);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:88px;border:0;background:none;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--ink);cursor:pointer;border-bottom:3px solid transparent}
.tab .ti{width:34px;height:34px;display:grid;place-items:center}
.tab .ti svg.i{width:26px;height:26px}
.tab.on{color:var(--blue);font-weight:700;border-bottom-color:var(--blue);background:linear-gradient(180deg,#fff,#eef5ff)}
.freebar{display:flex;align-items:center;justify-content:space-between;margin:10px 12px 0;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--navy);width:calc(100% - 24px);text-align:left}
.freebar span.cur{color:var(--muted);font-weight:500;font-size:13px}
.menu{display:none;margin:6px 12px 0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 30px -18px rgba(15,23,42,.4);padding:6px;max-height:70vh;overflow:auto}
.menu.open{display:block}
.mgroup{padding:8px 10px 2px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-size:14px}
.mitem:hover{background:#f2f6ff}
.mitem .ti{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px}
.mitem .ti svg.i{width:22px;height:22px}
.mitem.on{color:var(--blue);font-weight:700}
.mlogout{margin:6px 0 2px;width:100%;border:0;border-radius:10px;padding:10px;background:var(--red);color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

/* ---------- MAIN ---------- */
.main{padding:14px 12px 40px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 4px;border-left:5px solid var(--blue);padding-left:10px}
.pagehead h2{font-size:22px;font-weight:800;color:var(--navy)}
.psub{color:var(--muted);font-size:13px;margin:0 0 12px}
h3.sec{font-size:15px;font-weight:700;margin:18px 0 10px;color:var(--navy);display:flex;align-items:center;gap:8px}
h3.sec::before{content:'';width:4px;height:18px;border-radius:4px;background:var(--blue)}
.muted{color:var(--muted)}
.loading,.empty{padding:26px;text-align:center;color:var(--muted)}
.errbox{padding:16px;border-radius:14px;background:var(--red-t);color:#8a1c20;border:1px solid #f6c6c8;line-height:1.6}

/* ---------- DASHBOARD CARDS (icons fixed size, click karne par bada nahin) ---------- */
.big3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big3 .big:last-child{grid-column:1/-1}
.big{border:0;border-radius:18px;padding:14px;color:#fff;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:96px;position:relative;box-shadow:0 14px 24px -16px rgba(15,23,42,.5)}
.big .ic{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 58px;overflow:hidden}
.big .ic svg.i{width:30px;height:30px}
.big .lb{font-size:13px;opacity:.95;display:block}
.big b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.big .go{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.big .go svg.i{width:16px;height:16px}
.g-blue{background:linear-gradient(135deg,#1e6bff,#4f8dff)}
.g-orange{background:linear-gradient(135deg,#ff8a00,#ffb020)}
.g-purple{background:linear-gradient(135deg,#7c3aed,#a86bff)}
.g-green{background:linear-gradient(135deg,#12a150,#34c77a)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec-title h3{font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.sec-title h3::before{content:'';width:4px;height:18px;border-radius:4px;background:var(--blue)}
.sec-title a{font-size:13px;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:16px;padding:12px;border:1px solid transparent;text-align:left;cursor:pointer;background:#fff;display:flex;align-items:center;gap:10px;min-height:76px}
.tile .ti{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:0 0 52px;overflow:hidden;background:#fff}
.tile .ti svg.i{width:28px;height:28px}
.tile .tx{flex:1;min-width:0}
.tile .lb{font-size:12.5px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-size:21px;font-weight:800;display:block}
.tile .arr{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 26px}
.tile .arr svg.i{width:14px;height:14px}
.t-blue{background:var(--blue-t);border-color:#cfe0ff}.t-blue b{color:var(--blue)}
.t-green{background:var(--green-t);border-color:#c4ebd4}.t-green b{color:var(--green)}
.t-orange{background:var(--orange-t);border-color:#ffdcae}.t-orange b{color:var(--orange)}
.t-purple{background:var(--purple-t);border-color:#dccffd}.t-purple b{color:var(--purple)}
.t-red{background:var(--red-t);border-color:#f6c6c8}.t-red b{color:var(--red)}
.t-gold{background:var(--gold-t);border-color:#f0dfb0}.t-gold b{color:var(--gold)}
.tile.wide{grid-column:1/-1}

/* ---------- CARDS / TABLES / FORMS ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .grow{flex:1}
.inp{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0;width:100%}
.inp:focus{outline:2px solid #bcd3ff;border-color:var(--blue)}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.purple{background:var(--purple)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12.5px}
.chipbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.c-paid{background:#d9f5e4;color:#127a45}.c-due{background:#fde0e1;color:#b42328}.c-imam{background:var(--orange-t);color:#b35f00}.c-blk{background:#e5e7eb;color:#374151}.c-role{background:var(--blue-t);color:var(--blue)}
.wrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:640px}
table.t th{text-align:left;padding:9px 8px;background:#f7f9fd;color:var(--muted);font-weight:700;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid #eef1f6;vertical-align:middle;white-space:nowrap}
tr.row-paid td{background:#f3fbf6}tr.row-due td{background:#fff5f5}
.nm{color:var(--blue);font-weight:700;cursor:pointer;background:none;border:0;text-align:left}
.mono{font-family:"Courier New",monospace;font-size:12.5px}
.acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cl{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12.5px;padding:7px 11px;border-radius:10px;color:#fff;font-weight:700}
.cl.call{background:var(--blue)}.cl.wa{background:#25a244}
.cl svg.i{width:16px;height:16px}
.profile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.dp{width:132px;height:132px;border-radius:50%;background:linear-gradient(135deg,var(--blue-t),#dfe9ff);display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--blue);overflow:hidden;border:4px solid #fff;box-shadow:0 12px 24px -12px var(--blue);cursor:pointer}
.dp img{width:100%;height:100%;object-fit:cover}
.appid{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--navy);font-family:Arial,sans-serif}
.appid small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.pname{font-size:20px;font-weight:800;color:var(--navy)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px;text-align:left}
.info div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.info div b{font-weight:600;word-break:break-word}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sumc{border-radius:16px;padding:14px;color:#fff}
.sumc span{font-size:12px;opacity:.95}.sumc b{display:block;font-size:20px;margin-top:4px}
.creds{display:grid;grid-template-columns:1fr;gap:10px}
.cred{border:1px dashed #cbd5e1;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cred span{font-size:11.5px;color:var(--muted)}
.cred b{display:block;font-family:"Courier New",monospace;font-size:16px}
.fgrid{display:grid;grid-template-columns:1fr;gap:10px}
.fgrid.two{grid-template-columns:1fr 1fr}
.fl{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.fl textarea{min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;resize:vertical;width:100%}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.pbar{height:14px;border-radius:99px;background:#eef1f6;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .35s ease}
.sec-card{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.sec-card img,.sec-card .thumb{width:96px;height:78px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.sec-card .thumb{background:#eef3ff;display:grid;place-items:center;color:var(--blue)}
.sec-card p{color:var(--muted);margin-top:4px;line-height:1.6;white-space:pre-wrap}

/* ---------- OVERLAY ---------- */
#ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#ov.open{display:flex}
#ov .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:94vh;overflow:auto;padding:18px 16px 22px;position:relative}
#ov .box.wide{max-width:900px}
#ov .ttl{font-size:17px;font-weight:800;margin-bottom:12px;padding-right:34px;color:var(--navy)}
#ov .x{position:absolute;right:12px;top:12px;border:0;background:#f1f5f9;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
#ov .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
@media(min-width:700px){#ov{align-items:center}#ov .box{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;display:none;z-index:200;max-width:92vw;text-align:center}
.cred-box{background:#0f172a;color:#fff;border-radius:14px;padding:14px;display:grid;gap:10px}
.cred-box div{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cred-box b{font-family:"Courier New",monospace;font-size:17px;word-break:break-all}
.cred-box small{color:#94a3b8;font-size:11px;text-transform:uppercase;display:block}

/* ---------- RECEIPT: ek hi A4 page ---------- */
.rc{background:#fff;border:2px solid #1b4332;border-radius:8px;padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:11px;color:#000}
.rc-head{display:grid;grid-template-columns:50px 1fr 50px;align-items:center;gap:8px;border-bottom:2px solid #1b4332;padding-bottom:5px;margin-bottom:5px}
.rc-head .lg{width:46px;height:46px;border-radius:50%;border:2px solid #1b4332;display:grid;place-items:center;overflow:hidden}
.rc-head .lg img{width:100%;height:100%;object-fit:cover}
.rc-head .ttl{text-align:center}
.rc-head h2{font-size:15px;font-weight:900;text-transform:uppercase}
.rc-head p{font-size:9.5px;font-weight:700}
.rc-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;border:1px solid #000;padding:3px 6px;margin-bottom:5px;font-size:10px}
.rc-mid{display:grid;grid-template-columns:1.3fr 1fr;gap:5px;margin-bottom:5px}
.rc-box{border:1px solid #000;padding:4px 6px}
.rc-box div{display:flex;justify-content:space-between;gap:6px;padding:1px 0;border-bottom:1px dotted #777;font-size:9.5px}
.rc-box div:last-child{border:0}
.rc-box span{font-weight:700;text-transform:uppercase}
.rc-box b{text-align:right;font-weight:900}
.rc-box .rcid{font-size:12px}
.rc-sum{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rc-sum div{border:1px solid #000;padding:3px;text-align:center;font-size:8.5px}
.rc-sum b{display:block;font-size:11px;font-weight:900}
table.rt{width:100%;border-collapse:collapse;font-size:9px;border:1px solid #000}
table.rt th{background:#1b4332;color:#fff;padding:2px 3px;text-align:left;font-size:8.5px;font-weight:900}
table.rt td{padding:1px 3px;border-bottom:1px solid #999;font-weight:700;white-space:nowrap}
table.rt tr.mon td{background:#e9f3ec;font-weight:900}
.rc-sig{display:flex;justify-content:space-between;margin-top:8px;gap:12px}
.rc-sig div{width:150px;text-align:center;font-size:9px}
.rc-sig .si{height:28px;display:flex;align-items:flex-end;justify-content:center}
.rc-sig .si img{max-height:28px;max-width:120px;object-fit:contain}
.rc-sig .ln{border-bottom:1px solid #000;margin:2px 0 2px}
.rc-sig b{display:block;font-size:9px;font-weight:900}
@media print{
  @page{size:A4 portrait;margin:6mm}
  body *{visibility:hidden}
  #rc,#rc *{visibility:visible}
  #rc{position:absolute;left:0;top:0;width:198mm;padding:4mm;border:1.5px solid #1b4332;border-radius:0;font-size:9px;max-height:285mm;overflow:hidden}
  .noprint{display:none!important}
  #ov{position:static!important;background:none!important;display:block!important;padding:0!important}
  #ov .box{box-shadow:none;max-height:none;overflow:visible;padding:0;width:100%;max-width:100%}
  .hd,.tabs,.freebar,.menu,#topbar,#boot,.toast{display:none!important}
}
@media(min-width:900px){
  .hd{padding:16px 22px}
  .big3{grid-template-columns:repeat(3,1fr)}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .main{max-width:1100px;margin:0 auto}
}
</style>
</head>
<body>

<div id="topbar"><i></i></div>
<div id="boot">
  <div class="bt" id="bootT">Connecting…</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div class="bs" id="bootS">Please wait</div>
</div>

<header class="hd">
  <div class="row">
    <button class="menubtn" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="avatar" id="av" aria-label="My profile"></button>
  </div>
  <div class="seal" id="seal"></div>
  <div class="orgname" id="orgName">Community</div>
  <div class="role"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><span id="roleName">Super Admin</span></div>
  <div class="tag">Ilm • Iman • Seva</div>
</header>

<nav class="tabs" id="tabs"></nav>
<button class="freebar" id="freebar"><span id="curName">Dashboard</span><span class="cur">Menu ▾</span></button>
<div class="menu" id="menu"></div>

<main class="main" id="main"><div class="loading">Loading…</div></main>

<div id="ov"><div class="box" id="ovBox">
  <button class="x noprint" data-act="close" aria-label="Close">×</button>
  <div class="ttl" id="ovT"></div>
  <div id="ovB"></div>
  <div class="foot" id="ovF"></div>
</div></div>
<input type="file" id="dpFile" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
/* ============ ICONS (default SVG; Settings se URL aane par wahi dikhta hai) ============ */
const P = {
  home: 'M3 11l9-8 9 8v10H3z',
  users: 'M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM3 21a7 7 0 0 1 14 0M17 14a4 4 0 0 1 4 4v3',

/* ============ PROGRESS ============ */
let BUSY = 0;
function busyStart() { BUSY++; $('#topbar').style.display = 'block'; }
function busyEnd() { BUSY = Math.max(0, BUSY - 1); if (!BUSY) $('#topbar').style.display = 'none'; }
function bootProgress(pct, title, sub) {
  $('#bootBar').style.width = pct + '%';
  if (title) $('#bootT').textContent = title;
  if (sub) $('#bootS').textContent = sub;
}
function bootDone() { $('#boot').classList.add('gone'); }
function showError(text) { $('#main').innerHTML = '<div class="errbox"><b>Page could not load.</b><br>' + esc(text) + '</div>'; }
window.onerror = function (msg) { showError('Script error: ' + msg); };

/* Server call: TOKEN apne aap pehle argument */
async function api(fn, ...a) {
  busyStart();
  try {
    const r = await apiCall(fn, [TOKEN, ...a]);
    if (r && r.expired) { await leave(true); throw new Error('expired'); }
    if (r && r.ok === false) throw new Error(r.msg || 'Something went wrong.');
    return r;
  } finally { busyEnd(); }
}
function toast(m) {
  const el = $('#toast'); el.textContent = m; el.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 2600);
}
function digits(m) { const x = String(m || '').replace(/\D/g, ''); return x.length === 10 ? '91' + x : x; }
function callLink(m) { const d = digits(m); return d ? `<a class="cl call" href="tel:+${d}">${ic('phone')}Call</a>` : ''; }
function waLink(m, label) {
  const d = digits(m); if (!d) return '';
  return `<a class="cl wa" href="https://wa.me/${d}?text=${encodeURIComponent('Hello')}" target="_blank" rel="noopener">${ic('chat')}${label || 'WhatsApp'}</a>`;
}
function modal(title, body, foot, wide) {
  $('#ovT').textContent = title; $('#ovB').innerHTML = body; $('#ovF').innerHTML = foot || '';
  $('#ovBox').classList.toggle('wide', !!wide); $('#ov').classList.add('open');
}
function closeM() { $('#ov').classList.remove('open'); }
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
function copyText(s) { try { navigator.clipboard.writeText(s); toast('Copied'); } catch (e) { toast('Copy manually.'); } }
function fileToB64(f) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(f); }); }
function downloadCsv(name, text) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function avatarHtml(name, url) { return url ? `<img src="${esc(url)}" alt="">` : esc((name || 'S').charAt(0).toUpperCase()); }

/* ============ SESSION ============ */
async function leave(expired) {
  if (!expired && TOKEN) { try { await apiCall('apiLogout', [TOKEN]); } catch (e) {} }
  localStorage.removeItem(LS_S);
  goPage('index.html');
}

function isOn(n) {
  if (n.v === 'dash') return D.view === 'dash';
  if (n.a && n.a.role) return D.view === 'people' && D.arg.role === n.a.role;
  if (n.a && n.a.sec) return D.view === 'sec' && D.arg.sec === n.a.sec;
  return D.view === n.v;
}
function drawNav() {
  const tabsHtml = TAB_ITEMS.map(n => `<button class="tab ${isOn(n) ? 'on' : ''}" data-go="${n.v}" data-arg='${JSON.stringify(n.a || {})}'>
      <span class="ti">${iconHtml(n.ic)}</span><span>${n.l}</span></button>`).join('');
  $('#tabs').innerHTML = tabsHtml;
  const cur = allItems().find(isOn);
  $('#curName').textContent = cur ? cur.l : '';
  const isSuper = ME && ME.role === 'super_admin';
  $('#menu').innerHTML = GROUPS.map(g => {

    return `<div class="mgroup">${g.title}</div>` + items.map(n => `<button class="mitem ${isOn(n) ? 'on' : ''}" data-go="${n.v}" data-arg='${JSON.stringify(n.a || {})}'>

}
$('#menuBtn').addEventListener('click', () => $('#menu').classList.toggle('open'));
$('#freebar').addEventListener('click', () => $('#menu').classList.toggle('open'));

const VIEWS = {};
async function go(view, arg) {
  D = { view: view, arg: arg || {} };
  $('#menu').classList.remove('open');
  drawNav();
  window.scrollTo(0, 0);
  const c = $('#main');
  c.innerHTML = '<div class="loading">Loading…</div>';
  try { await VIEWS[view](c, D.arg); }
  catch (e) { if (e.message !== 'expired') c.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
}

async function saveDpUrl(target, url) {

async function openPersonForm(role, appNo) {
  let p = null;
  if (appNo) {
    const d = await api('apiSuperGetPerson', appNo);
    p = d.person; p.opening = d.summary.opening; role = p.role;
  }
  const isSuper = ME.role === 'super_admin';
  let admins = null;
  if (isSuper) {
    const o = await api('apiSuperOverview');
    admins = (o.admins || []).filter(a => a.status === 'ACTIVE');
    if (!admins.length) return toast('Create an Admin first (Admins page).');
  }
  modal(p ? 'Edit · ' + p.name : 'Add · ' + (LBL[role] || role), personForm(role, p, admins),
    `<button class="btn light" data-act="close">Cancel</button><button class="btn green" id="btnSave">Save</button>`);
  $('#btnSave').addEventListener('click', async () => {
    const btn = $('#btnSave'); if (btn.disabled) return; btn.disabled = true;
    try {
      const body = {
        appNo: p ? p.appNo : '', role: role, name: val('fName'), father: val('fFather'), mobile: val('fMobile'),
        address: val('fAddr'), joinDate: val('fJoin'), adminId: isSuper ? val('fAdmin') : '',
        photoUrl: p ? (p.photoUrl || '') : '', password: val('fPass'), token: p ? '' : val('fTok'),
        qualification: val('fQual'), whatsapp: val('fWa'), salary: val('fSal'), opening: val('fOpen') || 0
      };
      const r = await api('apiSuperSavePerson', body);
      if (!p) return showCreds('New person added', r.appNo, r.password, r.token);
      if (r.password || r.token) return showCreds('Login details updated', r.appNo, r.password, r.token);
      closeM(); toast('Saved'); openPersonPage($('#main'), p.appNo);
    } catch (e) { if (e.message !== 'expired') toast(e.message); }
    finally { btn.disabled = false; }
  });
}
function showCreds(title, appNo, pw, tk) {
  modal(title, `<div class="cred-box">
      <div><div><small>App no. / User ID</small><b>${esc(appNo)}</b></div><button class="btn light sm" data-act="copy" data-v="${esc(appNo)}">Copy</button></div>

async function openPay(appNo) {
  const d = await api('apiSuperGetPerson', appNo);
  const p = d.person, s = d.summary;

  const today = new Date().toISOString().slice(0, 10);
  modal('Receive payment · ' + p.name, `
    <p class="hint">Balance now: <b>${inr(s.baki)}</b>. Back-year is cleared first, then this year.</p>
    <div class="fgrid">
      <div><label class="fl">Amount (₹)<input class="inp" id="pAmt" type="number" min="1" max="${s.baki}"></label></div>
      <div><label class="fl">Date<input class="inp" id="pDate" type="date" value="${today}"></label></div>
      <div><label class="fl">Mode<select class="inp" id="pMode">${MODES.map(m => `<option>${m}</option>`).join('')}</select></label></div>
      <div><label class="fl">Transaction no. (online)<input class="inp" id="pTxn"></label></div>
      <div><label class="fl">Note<input class="inp" id="pNote"></label></div>
    </div>`,
    `<button class="btn light" data-act="close">Cancel</button><button class="btn green" id="btnPay">Receive</button>`);
  $('#btnPay').addEventListener('click', async () => {
    const b = $('#btnPay'); if (b.disabled) return; b.disabled = true;
    try {
      const r = await api('apiAddPayment', { appNo: appNo, amount: val('pAmt'), date: val('pDate'),
        mode: val('pMode'), txnRef: val('pTxn'), note: val('pNote') });
      toast('Payment received');
      await openReceipt(r.receiptId);

      <div><label class="fl">Note<input class="inp" id="oNote"></label></div></div>`,
    `<button class="btn light" data-act="close">Cancel</button><button class="btn purple" id="btnOut">Save</button>`);

    const b = $('#btnOut'); if (b.disabled) return; b.disabled = true;

        <div><span>Address</span><b>${esc(p.address || '—')}</b></div>
        <div><span>Admin</span><b>${esc(p.adminName || '—')}</b></div>
      </div>
      <div class="rc-sum">
        <div><span>Total due</span><b>${inr(r.due)}</b></div>
        <div><span>Total paid</span><b>${inr(r.paid)}</b></div>
        <div><span>Balance</span><b>${inr(r.balance)}</b></div>

VIEWS.import = async (c) => {
  c.innerHTML = `
    <div class="pagehead"><h2>Import / Export</h2></div>
    <p class="psub">Only Name is required. Other fields can be empty and edited later.</p>
    <div class="card">
      <h3 class="sec">1. Template or current data</h3>
      <div class="acts"><button class="btn light sm" data-act="tplCsv">${ic('download')}Template</button>
        <button class="btn light sm" data-act="dataCsv">${ic('download')}Export data</button></div>
    </div>
    <div class="card">
      <h3 class="sec">2. Upload CSV (ek file, ek baar)</h3>
      <p class="hint">Columns: User ID, Password, Token ID, Name, Father's Name, Mobile, Address, Back year due, Current year subscription, Paid amount, Photo URL, Role.</p>
      <input type="file" id="csvFile" accept=".csv,text/csv" class="inp">
      <button class="btn green" id="btnImport" data-act="runImport" disabled style="margin-top:10px;width:100%">Import</button>
      <p class="hint" id="csvInfo" style="margin-top:10px">${CSV_TEXT ? esc(CSV_NAME) + ' · ' + CSV_ROWS + ' rows ready' : 'No file selected.'}</p>
      <div class="pbar"><i id="impBar"></i></div>
      <div id="impText" class="muted" style="font-size:13px"></div>
      <div id="impRes" style="margin-top:12px"></div>
    </div>`;
  if (CSV_TEXT && CSV_ROWS > 0 && !IMPORTING) $('#btnImport').disabled = false;
};
async function runImport() {
  if (IMPORTING) return;
  if (!CSV_TEXT) return toast('Select a CSV file first.');
  IMPORTING = true;
  const btn = $('#btnImport'); btn.disabled = true; $('#csvFile').disabled = true;
  const lines = CSV_TEXT.split(/\r?\n/).filter(l => l.trim() !== '');
  const header = lines[0], rows = lines.slice(1), total = rows.length;
  let added = 0, done = 0; const errors = [];
  try {
    for (let i = 0; i < rows.length; i += IMPORT_BATCH) {
      const chunk = rows.slice(i, i + IMPORT_BATCH);
      $('#impText').textContent = 'Importing ' + (done + 1) + ' to ' + (done + chunk.length) + ' of ' + total + '…';
      const r = await api('apiSuperImport', header + '\n' + chunk.join('\n'));
      added += r.added;
      r.errors.forEach(e => errors.push(e.replace(/Row (\d+):/, (m, n) => 'Row ' + (Number(n) + i + 1) + ':')));
      done += chunk.length;
      $('#impBar').style.width = Math.round(done / total * 100) + '%';
      $('#impText').textContent = 'Imported ' + done + ' of ' + total + ' · added ' + added;
    }
    $('#impText').textContent = 'Done. Added ' + added + ' of ' + total + ' rows.';
    $('#impRes').innerHTML = `<div class="cred-box"><div><div><small>Added</small><b>${added}</b></div></div>
      <div><div><small>Errors</small><b>${errors.length}</b></div></div></div>
      ${errors.length ? `<div class="card" style="margin-top:8px">${errors.map(e => `<div>${esc(e)}</div>`).join('')}</div>` : ''}`;
    toast('Import complete');
  } catch (e) { if (e.message !== 'expired') toast(e.message); }
  finally {
    IMPORTING = false;
    CSV_TEXT = null; CSV_NAME = ''; CSV_ROWS = 0;
    $('#csvFile').value = ''; $('#csvFile').disabled = false;
    $('#csvInfo').textContent = 'Import finished. Select a NEW file to import again.';
    btn.disabled = true;
  }
}

function DP_TARGET_SET(t) { $('#ovF').dataset.target = t; }

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) {
    closeM();
    try { return go(g.dataset.go, JSON.parse(g.dataset.arg || '{}')); }
    catch (err) { return toast(err.message); }
  }
  if (e.target.closest('#av')) return go('profile', {});
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACTS[b.dataset.act];
  if (!fn) return;
  try { await fn(b.dataset.id || '', b); }
  catch (err) { if (err.message !== 'expired') toast(err.message); }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'csvFile') {
    const f = e.target.files[0];
    if (!f) { CSV_TEXT = null; CSV_ROWS = 0; $('#btnImport').disabled = true; return; }
    CSV_TEXT = await f.text(); CSV_NAME = f.name;
    CSV_ROWS = Math.max(0, CSV_TEXT.split(/\r?\n/).filter(l => l.trim() !== '').length - 1);
    $('#csvInfo').textContent = f.name + ' · ' + CSV_ROWS + ' rows ready. Press Import once.';
    $('#impBar').style.width = '0%'; $('#impText').textContent = '';
    $('#btnImport').disabled = CSV_ROWS === 0;
    return;
  }
  if (e.target.id === 'dpFile') {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (f.size > 1.4 * 1024 * 1024) return toast('Photo must be under 1.4 MB.');
    const b64 = await fileToB64(f);
    DP_PENDING = { b64: b64, mime: f.type, name: f.name };
    showDpPending('data:' + f.type + ';base64,' + b64);
    return;
  }
  if (e.target.id === 'fPhoto' || e.target.id === 'sPhoto') {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 1.4 * 1024 * 1024) return toast('Photo must be under 1.4 MB.');
    const b64 = await fileToB64(f);
    try {
      toast('Uploading photo…');
      const r = await api('apiUploadPhoto', b64, f.type, f.name);
      const person = e.target.id === 'fPhoto';
      $(person ? '#fPhotoUrl' : '#sPhotoUrl').value = r.url;
      const img = $(person ? '#fPrev' : '#sPrev'); img.src = r.url; img.style.display = 'block';
      toast('Photo uploaded');
    } catch (err) { if (err.message !== 'expired') toast(err.message); }
  }
});

/* ============ BOOT ============ */
async function boot() {
  TOKEN = localStorage.getItem(LS_S);
  if (!TOKEN) return goPage('index.html');
  try {
    bootProgress(15, 'Checking your login…', 'Verifying session');
    const r = await apiCall('apiSession', [TOKEN]);
    if (!r || !r.ok) return leave(true);
    if (r.user.role !== 'super_admin') return goPage(ROLE_PAGE[r.user.role] || 'index.html');
    if (r.mustChange) return goPage('index.html');
    ME = r.user;
    $('#roleName').textContent = 'Super Admin';
    applyOrg({ name: (r.org && r.org.name) || 'Community', logo: (r.org && r.org.logo) || '' });
    bootProgress(35, 'Loading icons…', 'Dashboard pictures');
    const ic2 = await apiCall('apiGetIcons', [TOKEN]).catch(() => null);
    ICONS = (ic2 && ic2.icons) || {};
    bootProgress(55, 'Loading your profile…', 'Photo and details');
    const ph = await apiCall('apiAdminGetPhoto', [TOKEN]).catch(() => null);
    MY_PHOTO = (ph && ph.url) || '';
    $('#av').innerHTML = avatarHtml(ME.name, MY_PHOTO);
    bootProgress(75, 'Loading dashboard…', 'Counts and payments');
    startIdle();
    await go('dash', {});
    bootProgress(100, 'Ready', 'Welcome');
    setTimeout(bootDone, 250);
  } catch (e) {
    bootDone();
    showError(e.message);
  }
}

let LAST = Date.now();
function startIdle() {
  ['mousemove', 'keydown', 'click', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { LAST = Date.now(); }, { passive: true }));
  setInterval(async () => {
    if (!TOKEN) return;
    if (Date.now() - LAST > 15 * 60 * 1000) { toast('Logged out after 15 minutes of inactivity.'); return leave(false); }
    const r = await apiCall('apiSession', [TOKEN]).catch(() => null);
    if (!r || !r.ok) leave(true);
  }, 60000);
}

boot();
</script>
